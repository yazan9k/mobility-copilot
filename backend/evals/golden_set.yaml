    expected_source_docs: ["08-escalation-criteria.md"]
    expected_answer_criteria:
      - "Declines despite the stated managerial need"
      - "Routes to Global Mobility to confirm what may be shared"
    requires_escalation: true

  - id: amb-008
    category: ambiguous_or_out_of_scope
    persona: P5
    query: "Is Meridian's relocation package better than what Google offers?"
    expected_answer_criteria:
