  # =========================================================================
  # MULTI-TURN (8)
  # =========================================================================

  - id: multi-001
    category: multi_turn
    persona: P2
    query: "So what's my housing stipend then?"
    history:
      - role: user
        content: "I'm going to Singapore for a 5 month project assignment."
      - role: assistant
        content: "Understood — a 5 month project assignment to Singapore is a short-term assignment under Meridian's policy."
    expected_tool_calls:
      - name: search_policy_kb
    expected_source_docs: ["03-housing-stipend.md"]
    expected_answer_criteria:
      - "Carries forward that this is a short-term assignment"
      - "States there is no housing stipend and gives the per-diem instead"
    requires_escalation: false

  - id: multi-002
    category: multi_turn
    persona: P1
    query: "And what about my husband and kids?"
    history:
      - role: user
        content: "I'm doing a permanent transfer from Bangalore to Amsterdam."
      - role: assistant
        content: "That's a permanent transfer to a tier 1 destination. Your relocation allowance would be the tier 1 rate."
    expected_tool_calls:
      - name: search_policy_kb
    expected_source_docs: ["09-dependent-and-family-support.md"]
    expected_answer_criteria:
      - "Understands 'husband and kids' refers to relocating dependents in the Netherlands context"
      - "Covers dependent residence permits and/or school allowance"
      - "Does not lose the Netherlands destination from context"
    requires_escalation: false

  - id: multi-003
    category: multi_turn
    persona: P3
    query: "Do I need new documents for it?"
    history:
      - role: user
        content: "My UAE permit expires in about three months and I need to renew."
      - role: assistant
        content: "You're inside the 90-day window, so the renewal should be initiated now."
    expected_tool_calls:
      - name: search_policy_kb
    expected_source_docs: ["07-document-requirements.md"]
    expected_answer_criteria:
      - "Understands 'it' refers to the UAE renewal"
      - "States documents subject to validity windows must be reissued"
    requires_escalation: false

  - id: multi-004
    category: multi_turn
    persona: P4
    query: "What about the tax side of that?"
    history:
      - role: user
        content: "I'm a band 6 permanent transfer from San Francisco to Zurich."
      - role: assistant
        content: "As a band 6 permanent transfer you're on the senior relocation allowance schedule."
    expected_tool_calls:
      - name: escalate_to_human
    expected_source_docs: ["05-tax-equalization.md", "08-escalation-criteria.md"]
    expected_answer_criteria:
      - "May explain what tax equalization is in general"
      - "Does NOT give an individual tax position"
      - "Escalates"
    requires_escalation: true

  - id: multi-005
    category: multi_turn
    persona: P2
    query: "It's now been extended to 9 months. Does that change anything?"
    history:
      - role: user
        content: "I'm on a 5 month assignment in Singapore."
      - role: assistant
        content: "As a short-term assignee you receive a per-diem rather than a housing stipend."
    expected_tool_calls:
      - name: escalate_to_human
    expected_source_docs: ["10-repatriation-and-assignment-end.md"]
    expected_answer_criteria:
      - "Recognises crossing 6 months changes assignment type, permit class, and tax position"
      - "States entitlements change prospectively from extension approval, not retroactively"
      - "Escalates for tax review"
    requires_escalation: true

  - id: multi-006
    category: multi_turn
    persona: P1
    query: "How long will all that take?"
    history:
      - role: user
        content: "I'm relocating to India from the Netherlands with my family."
      - role: assistant
        content: "That's a tier 3 destination, which carries the heaviest document requirements."
    expected_tool_calls:
      - name: get_relocation_timeline
        arguments:
          destination: India
    expected_source_docs: ["06-relocation-timeline.md"]
    expected_answer_criteria:
      - "Gives the tier 3 total of roughly 18-26 weeks"
      - "Notes dependent applications add further weeks"
    requires_escalation: false

  - id: multi-007
    category: multi_turn
    persona: P1
    query: "Can he work there?"
    history:
      - role: user
        content: "I'm moving to Amsterdam with my husband."
      - role: assistant
        content: "Meridian sponsors dependent residence permits for a spouse on the same basis as your own permit."
    expected_tool_calls:
      - name: escalate_to_human
    expected_source_docs: ["08-escalation-criteria.md", "09-dependent-and-family-support.md"]
    expected_answer_criteria:
      - "Recognises the shift from residence to work authorisation"
      - "Does NOT answer whether he may work"
      - "Escalates"
    requires_escalation: true

  - id: multi-008
    category: multi_turn
    persona: P2
    query: "OK and can I ship my things?"
    history:
      - role: user
        content: "I'm on a short term assignment, under 6 months, to Singapore."
      - role: assistant
        content: "Understood. Short-term assignees receive a per-diem rather than the housing stipend."
    expected_tool_calls:
      - name: search_policy_kb
    expected_source_docs: ["04-shipping-and-moving.md"]
    expected_answer_criteria:
